<!DOCTYPE html>
<!-- same markup, two looks -- just swap the linked stylesheet -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Box Styles</title>

<!-- swap between styleA.css / styleB.css -->
<link rel="stylesheet" href="styleA.css">
</head>
<body>

<!-- A-E wrapped so B can row them, A can flatten the wrapper -->
<div class="container">
  <div class="box" id="box-a">A</div>
  <div class="box" id="box-b">B</div>
  <div class="box" id="box-c">C</div>
  <div class="box" id="box-d">D</div>
  <div class="box" id="box-e">E</div>
</div>

<!-- F is always a special case, kept separate -->
<div class="box last" id="box-f">F</div>

</body>
</html>
